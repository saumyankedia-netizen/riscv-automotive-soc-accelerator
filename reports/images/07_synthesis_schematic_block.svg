<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" fill="#0d1117"/>
  
  <!-- Outer Title Banner -->
  <rect x="20" y="20" width="960" height="45" fill="#161b22" stroke="#30363d" rx="6"/>
  <text x="500" y="48" fill="#58a6ff" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    Yosys 0.46 Logic Synthesis &amp; Technology Mapping Hierarchy (soc_core)
  </text>
  
  <!-- soc_core Boundary -->
  <rect x="30" y="85" width="940" height="490" fill="#161b22" stroke="#58a6ff" stroke-width="2" rx="8"/>
  <text x="50" y="112" fill="#58a6ff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    Module \soc_core (SkyWater 130nm / sky130_fd_sc_hd &bull; Area: 168,195 um2 &bull; 14,832 Cells)
  </text>
  
  <!-- PicoRV32 Sub-block -->
  <rect x="60" y="135" width="280" height="360" fill="#0d1117" stroke="#388bfd" stroke-width="2" rx="6"/>
  <text x="200" y="165" fill="#58a6ff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">cpu : picorv32</text>
  <text x="200" y="185" fill="#8b949e" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">RV32I Core (89,200 um2)</text>
  
  <!-- Inside CPU -->
  <rect x="80" y="205" width="240" height="75" fill="#161b22" stroke="#30363d" rx="4"/>
  <text x="200" y="235" fill="#f0883e" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Register File (regs[0:31])</text>
  <text x="200" y="255" fill="#8b949e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Single-Port (ENABLE_REGS_DUALPORT=0)</text>
  
  <rect x="80" y="295" width="240" height="55" fill="#161b22" stroke="#30363d" rx="4"/>
  <text x="200" y="325" fill="#3fb950" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ALU &amp; Two-Stage Shifter</text>
  
  <rect x="80" y="365" width="240" height="55" fill="#161b22" stroke="#30363d" rx="4"/>
  <text x="200" y="395" fill="#a371f7" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Microcoded CPU Controller FSM</text>

  <rect x="80" y="435" width="240" height="45" fill="#161b22" stroke="#30363d" rx="4"/>
  <text x="200" y="462" fill="#d29922" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CSR Perf Counters (rdcycle)</text>

  <!-- Bus Interconnect (MMIO Decoder) -->
  <rect x="385" y="135" width="230" height="360" fill="#0d1117" stroke="#d29922" stroke-width="2" rx="6"/>
  <text x="500" y="165" fill="#d29922" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">decoder : mmio_decoder</text>
  <text x="500" y="185" fill="#8b949e" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Address Routing (9,800 um2)</text>
  
  <rect x="405" y="215" width="190" height="55" fill="#161b22" stroke="#30363d" rx="4"/>
  <text x="500" y="242" fill="#58a6ff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SRAM Decoder</text>
  <text x="500" y="258" fill="#8b949e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">0x00000000 - 0x00003FFF</text>

  <rect x="405" y="285" width="190" height="55" fill="#161b22" stroke="#30363d" rx="4"/>
  <text x="500" y="312" fill="#3fb950" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Accel MMIO Decoder</text>
  <text x="500" y="328" fill="#8b949e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">0x10000000 - 0x100000FF</text>

  <rect x="405" y="355" width="190" height="55" fill="#161b22" stroke="#30363d" rx="4"/>
  <text x="500" y="382" fill="#f0883e" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GPIO Decoder</text>
  <text x="500" y="398" fill="#8b949e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">0x20000000 - 0x2000000F</text>

  <rect x="405" y="425" width="190" height="55" fill="#161b22" stroke="#30363d" rx="4"/>
  <text x="500" y="452" fill="#f85149" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Bus Ready/Data Mux</text>
  <text x="500" y="468" fill="#8b949e" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Returns 0xDEADBEEF unmapped</text>

  <!-- Dummy Accelerator Sub-block -->
  <rect x="660" y="135" width="280" height="250" fill="#0d1117" stroke="#3fb950" stroke-width="2" rx="6"/>
  <text x="800" y="165" fill="#3fb950" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">accel : dummy_accelerator</text>
  <text x="800" y="185" fill="#8b949e" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Hardware MAC Pipeline (62,500 um2)</text>
  
  <rect x="680" y="205" width="240" height="50" fill="#161b22" stroke="#30363d" rx="4"/>
  <text x="800" y="235" fill="#58a6ff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Signed 32x32 Multiplier</text>
  
  <rect x="680" y="265" width="240" height="50" fill="#161b22" stroke="#30363d" rx="4"/>
  <text x="800" y="295" fill="#3fb950" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">64-bit Accumulator &amp; Adders</text>
  
  <rect x="680" y="325" width="240" height="45" fill="#161b22" stroke="#30363d" rx="4"/>
  <text x="800" y="352" fill="#f0883e" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">FSM Multi-Cycle Controller (6 States)</text>

  <!-- GPIO Peripheral -->
  <rect x="660" y="405" width="280" height="90" fill="#0d1117" stroke="#f0883e" stroke-width="2" rx="6"/>
  <text x="800" y="435" fill="#f0883e" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">GPIO Latch &amp; Output Pins</text>
  <text x="800" y="460" fill="#8b949e" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">32-bit Diagnostics (gpio_out[31:0])</text>

  <!-- Signal Interconnect Arrows -->
  <!-- CPU to Decoder -->
  <line x1="340" y1="230" x2="385" y2="230" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="385" y1="250" x2="340" y2="250" stroke="#58a6ff" stroke-width="2.5"/>
  <text x="362" y="222" fill="#58a6ff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">valid/addr</text>
  <text x="362" y="265" fill="#58a6ff" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">ready/rdata</text>

  <!-- Decoder to Accel -->
  <line x1="615" y1="240" x2="660" y2="240" stroke="#3fb950" stroke-width="2.5"/>
  <line x1="660" y1="260" x2="615" y2="260" stroke="#3fb950" stroke-width="2.5"/>

  <!-- Decoder to GPIO -->
  <line x1="615" y1="440" x2="660" y2="440" stroke="#f0883e" stroke-width="2.5"/>
</svg>
