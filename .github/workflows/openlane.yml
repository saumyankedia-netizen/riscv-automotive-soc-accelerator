name: RTL to GDSII Flow (OpenLane 2 / Sky130)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  openlane:
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Checkout on the HOST runner ─────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Pull OpenLane 2 image ───────────────────────────────────────────
      - name: Pull OpenLane 2 Docker image
        run: docker pull ghcr.io/efabless/openlane2:2.3.10

      # ── 3. Run RTL-to-GDSII — workspace volume-mounted into container ──────
      - name: Run OpenLane 2 Flow
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            ghcr.io/efabless/openlane2:2.3.10 \
            openlane \
              --pdk sky130 \
              --pdk-variant sky130A \
              openlane/soc_core/config.json

      # ── 4. Upload GDSII and reports ────────────────────────────────────────
      - name: Upload GDSII and Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soc_core_gdsii
          path: |
            openlane/soc_core/runs/*/final/gds/*.gds
            openlane/soc_core/runs/*/final/def/*.def
            openlane/soc_core/runs/*/reports/metrics.csv
            openlane/soc_core/runs/*/reports/synthesis/*.stat.rpt
            openlane/soc_core/runs/*/reports/
