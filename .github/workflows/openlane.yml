name: RTL to GDSII Flow (OpenLane / Sky130)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  openlane:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OpenLane Flow
        uses: efabless/openlane-action@v1
        with:
          design_dir: "openlane"
          pdk: "sky130A"

      - name: Upload GDSII and Layout Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soc_core_gdsii
          path: |
            openlane/runs/*/results/final/gds/*.gds
            openlane/runs/*/results/final/def/*.def
            openlane/runs/*/reports/metrics.csv
            openlane/runs/*/reports/synthesis/*.stat.rpt

