name: RTL to GDSII Flow (OpenLane / Sky130)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  openlane:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OpenLane Flow (Docker)
        run: |
          docker run --rm \
            -v $PWD:/work \
            -w /work \
            efabless/openlane:latest \
            /openlane/flow.tcl -design openlane -tag run_soc_core

      - name: Upload GDSII and Layout Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soc_core_gdsii
          path: |
            openlane/runs/*/results/final/gds/*.gds
            openlane/runs/*/results/final/def/*.def
            openlane/runs/*/reports/metrics.csv
            openlane/runs/*/reports/synthesis/*.stat.rpt
            openlane/runs/*/reports/
