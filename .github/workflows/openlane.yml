name: RTL to GDSII Flow (OpenLane 2 / Sky130)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  openlane:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/efabless/openlane2:latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Verify tools are present ────────────────────────────────────────
      - name: Verify OpenLane 2 installation
        run: python3 -m openlane --version

      # ── 3. Run OpenLane 2 RTL-to-GDSII flow ───────────────────────────────
      - name: Run OpenLane 2 Flow
        run: |
          python3 -m openlane openlane/soc_core/config.json

      # ── 4. Upload GDSII and reports ────────────────────────────────────────
      - name: Upload GDSII and Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soc_core_gdsii
          path: |
            openlane/soc_core/runs/*/final/gds/*.gds
            openlane/soc_core/runs/*/final/def/*.def
            openlane/soc_core/runs/*/reports/metrics.csv
            openlane/soc_core/runs/*/reports/synthesis/*.stat.rpt
            openlane/soc_core/runs/*/reports/
