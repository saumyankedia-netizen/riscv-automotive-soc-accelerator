name: RTL to GDSII Flow (OpenLane 2 / Sky130)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  openlane:
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # ── 3. Nix (required by OpenLane 2 for Yosys / OpenROAD / Magic) ──────
      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # ── 4. Install volare + OpenLane 2 ────────────────────────────────────
      - name: Install volare and OpenLane 2
        run: |
          pip install --upgrade pip
          pip install volare
          pip install --upgrade openlane

      # ── 5. Cache Sky130 PDK (saves ~15 min on cache hit) ──────────────────
      - name: Cache Sky130 PDK
        id: cache-pdk
        uses: actions/cache@v4
        with:
          path: ~/.volare
          key: volare-sky130-${{ hashFiles('openlane/soc_core/config.json') }}
          restore-keys: |
            volare-sky130-

      # ── 6. Download Sky130 PDK via volare ─────────────────────────────────
      - name: Enable Sky130 PDK
        if: steps.cache-pdk.outputs.cache-hit != 'true'
        run: |
          volare enable --pdk sky130

      # ── 7. Run OpenLane 2 flow ─────────────────────────────────────────────
      - name: Run OpenLane 2 Flow
        env:
          PDK_ROOT: ${{ github.workspace }}/.volare
        run: |
          export PDK_ROOT=$HOME/.volare
          python3 -m openlane \
            --pdk sky130 \
            --pdk-root $HOME/.volare \
            openlane/soc_core/config.json

      # ── 8. Upload GDSII artifacts ──────────────────────────────────────────
      - name: Upload GDSII and Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soc_core_gdsii
          path: |
            openlane/soc_core/runs/*/final/gds/*.gds
            openlane/soc_core/runs/*/final/def/*.def
            openlane/soc_core/runs/*/reports/metrics.csv
            openlane/soc_core/runs/*/reports/synthesis/*.stat.rpt
            openlane/soc_core/runs/*/reports/
